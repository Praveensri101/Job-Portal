{% extends "base.html" %}
{% block title %}Register · OpenHire{% endblock %}
{% block content %}
<div class="form-card">
  <h1>Create your account</h1><p>Join OpenHire to apply for opportunities.</p>
  <form method="post">
    <label>Full name</label><input name="name" required>
    <label>Email</label><input type="email" name="email" required>
    <label>Password</label><input type="password" name="password" minlength="6" required>
    <button type="submit">Create account</button>
  </form>
  <p class="form-note">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
